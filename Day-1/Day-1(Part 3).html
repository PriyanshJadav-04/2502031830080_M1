<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 (Part 3)</title>
</head>

<body>
    <!-- ____________________iFrame_________________ -->
    <hr>
    <h4>iFrame (Map)</h4>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d235014.29910603!2d72.41492694155106!3d23.020158087361955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e848aba5bd449%3A0x4fcfdd11614f6516!2sAhmedabad%2C%20Gujarat!5e0!3m2!1sen!2sin!4v1715423370000!5m2!1sen!2sin"
        width="300" height="200" title="Ahmedabad">
    </iframe>

    <!-- ____________________Form_________________ -->
    <hr>
    <form action="" style="background-color: lightgreen;">
        <h1 style="text-align: center; padding-top: 10px;">Resgistration Form</h1>
        <div>
            <table border="1" align="center" width="600">
                <tr align="center">
                    <td colspan="2">
                        <label for="">First Name: </label>
                    </td>
                    <td align="left">
                        <input type="fname" placeholder="Enter Your First Name" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Last Name: </label>
                    </td>
                    <td align="left">
                        <input type="lname" placeholder="Enter Your Last Name" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Contact No: </label>
                    </td>
                    <td align="left">
                        <input type="number" placeholder="Enter Your Contact Number" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Landline No: </label>
                    </td>
                    <td align="left">
                        <input type="number" placeholder="Enter Your Landline Number" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Email: </label>
                    </td>
                    <td align="left">
                        <input type="email" placeholder="Enter Your Email" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Password: </label>
                    </td>
                    <td align="left">
                        <input type="password" placeholder="Enter Your Password" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Birth Date: </label>
                    </td>
                    <td align="left">
                        <input type="date" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Age: </label>
                    </td>
                    <td align="left">
                        <input type="age" placeholder="Enter Your Age" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Gender: </label>
                    </td>
                    <td align="left">
                        Male <input type="radio" name="gender" required>
                        Female <input type="radio" name="gender" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Address: </label>
                    </td>
                    <td align="left" colspan="6">
                        <textarea name="Address" style="width: 490px !important;" required></textarea>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">City: </label>
                    </td>
                    <td align="left" colspan="6">
                        <select name="select">
                            <option disabled selected>Select City</option>
                            <option value="ah">Ahmedabad</option>
                            <option value="go">Goa</option>
                            <option value="rj">Rajkot</option>
                            <option value="va">Vadodra</option>
                        </select>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Pincode: </label>
                    </td>
                    <td align="left">
                        <input type="pincode" placeholder="Pincode" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Joining Date: </label>
                    </td>
                    <td align="left">
                        <input type="date" required>
                    </td>
                </tr>
                <tr align="center">
                    <td colspan="2">
                        <label for="">Submit or Rest </label>
                    </td>
                    <td align="left">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </td>
                </tr>
            </table>
        </div>
    </form>
</body>

</html>
